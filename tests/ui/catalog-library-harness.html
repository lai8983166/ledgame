<!doctype html><html><head><meta charset="utf-8" /></head><body><div id="app"></div>
<script type="module">
import { createApp, h } from 'vue';
import { i18n, initializeApplicationLocale, setApplicationLocale } from '../../src/i18n/index.js';
import MediaPickerDialog from '../../src/components/MediaPickerDialog.vue';
import GameGlobalConfigDialog from '../../src/components/GameGlobalConfigDialog.vue';
import ApplicationSettingsView from '../../src/views/ApplicationSettingsView.vue';
import Elc408DebugAssistantView from '../../src/views/Elc408DebugAssistantView.vue';
import GameListView from '../../src/views/GameListView.vue';
import LedGameTouchView from '../../src/views/LedGameTouchView.vue';
import MediaLibraryView from '../../src/views/MediaLibraryView.vue';
import SpiritLibraryView from '../../src/views/SpiritLibraryView.vue';
import GameWiringDialog from '../../src/components/GameWiringDialog.vue';
import SimpleGameEditorView from '../../src/views/SimpleGameEditorView.vue';
import RankGameEditorView from '../../src/views/RankGameEditorView.vue';
import EditorDebugWorkspace from '../../src/views/EditorDebugWorkspace.vue';
import App from '../../src/App.vue';
import '../../src/style.css';
let app;
await initializeApplicationLocale();
window.changeTestLocale = setApplicationLocale;
window.getComponentSetup = () => app?._instance?.subTree?.component?.setupState;
window.mountComponent = (component, props, { applicationShell = false } = {}) => {
  app?.unmount();
  window.componentEvents = [];
  app = createApp({ render: () => {
    const view = h({ MediaPickerDialog, GameGlobalConfigDialog, ApplicationSettingsView,
    Elc408DebugAssistantView, GameListView, LedGameTouchView, MediaLibraryView, SpiritLibraryView,
    GameWiringDialog, SimpleGameEditorView, RankGameEditorView, EditorDebugWorkspace, App }[component], {
    ...props,
    onSelect: path => window.componentEvents.push(['select', path]),
    onCancel: () => window.componentEvents.push(['cancel']),
    onSave: value => window.componentEvents.push(['save', value]),
    onExit: () => window.componentEvents.push(['exit']),
    onOpenGame: game => window.componentEvents.push(['open-game', game]),
    });
    return applicationShell ? h('main', { class: 'app-shell app-shell--custom-titlebar' }, [
      h('div', { class: 'window-titlebar' }, 'LED Game'),
      h('header', { class: 'app-nav' }, '游戏'),
      view,
    ]) : view;
  } });
  app.use(i18n).mount('#app');
};
</script><style>#app { height: 100vh; overflow: auto; padding: 20px; background: var(--ui-base); color: var(--ui-text); } #app:has(> .app-shell) { padding: 0; overflow: hidden; }</style></body></html>
