<!doctype html><html><head><meta charset="utf-8" /></head><body><div id="app"></div>
<script type="module">
import { createApp, h } from 'vue';
import { i18n, initializeApplicationLocale, setApplicationLocale } from '../../src/i18n/index.js';
import MediaPickerDialog from '../../src/components/MediaPickerDialog.vue';
import GameGlobalConfigDialog from '../../src/components/GameGlobalConfigDialog.vue';
import ApplicationSettingsView from '../../src/views/ApplicationSettingsView.vue';
import Elc408DebugAssistantView from '../../src/views/Elc408DebugAssistantView.vue';
import GameListView from '../../src/views/GameListView.vue';
import LedGameTouchView from '../../src/views/LedGameTouchView.vue';
import MediaLibraryView from '../../src/views/MediaLibraryView.vue';
import SpiritLibraryView from '../../src/views/SpiritLibraryView.vue';
import '../../src/style.css';
let app;
await initializeApplicationLocale();
window.changeTestLocale = setApplicationLocale;
window.mountComponent = (component, props) => {
  app?.unmount();
  window.componentEvents = [];
  app = createApp({ render: () => h({ MediaPickerDialog, GameGlobalConfigDialog, ApplicationSettingsView,
    Elc408DebugAssistantView, GameListView, LedGameTouchView, MediaLibraryView, SpiritLibraryView }[component], {
    ...props,
    onSelect: path => window.componentEvents.push(['select', path]),
    onCancel: () => window.componentEvents.push(['cancel']),
  }) });
  app.use(i18n).mount('#app');
};
</script><style>#app { height: 100vh; overflow: auto; padding: 20px; background: var(--ui-base); color: var(--ui-text); }</style></body></html>
